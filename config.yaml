browser:
  profile_dir: "./browser_profile"
  headless: false  # Set to true to hide browser window (Cloudflare blocks headless)
  channel: "chrome"  # Use real Chrome instead of Playwright's Chromium
  location: "jakarta"  # City for geolocation and OLX filter: jakarta, bandung, yogyakarta

scraping:
  olx:
    enabled: true
    max_pages: 10
    page_delay_seconds: 3
    timeout_seconds: 30
    captcha_pause_seconds: 60
  facebook:
    enabled: false  # Set to true when Facebook session is ready
    max_listings: 100
    timeout_seconds: 30
    captcha_pause_seconds: 60

scoring:
  thresholds:
    safe_min: 70
    suspicious_min: 40
  weights:
    price_deviation: 0.20
    image_count: 0.10
    description_length: 0.10
    seller_age: 0.15
    seller_listing_history: 0.10
    contact_info: 0.10
    mileage_consistency: 0.10
    location_specificity: 0.15

publishing:
  twitter:
    max_posts_per_run: 30
    post_interval_seconds: 120
  threads:
    max_posts_per_run: 25
    post_interval_seconds: 120

scheduling:
  scrape_cron: "12 23 * * *"
  publish_cron: "15 23 * * *"
  enable_scrape: true
  enable_publish: true

database:
  url: "sqlite:///car_sales_feed.db"
  retry_max: 3
  dead_letter_path: "dead_letter.jsonl"
